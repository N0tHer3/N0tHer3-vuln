<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
    <div id="app">
        <!-- 登录页 -->
        <div id="login-page" class="login-page">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="TY.png" alt="logo" width="40" height="40" style="border-radius:8px;object-fit:cover">
                    </div>
                    <h1>N0tHer3-vuln 内部靶场</h1>

                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label>账号</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" id="login-username" placeholder="请输入账号" autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-wrap">
                            <input type="checkbox" checked> <span>记住账号</span>
                        </label>
                    </div>
                    <button type="submit" class="btn-login">登 录</button>
                </form>
                <div class="login-footer">
                    <span>N0tHer3-vuln &copy; 2025 · 内部靶场 · 仅供安全学习</span>
                </div>
            </div>
        </div>

            <aside class="sidebar">

                <nav class="sidebar-nav">

                        <span>工作台</span>
                    </a>
                    <a href="#profile" class="nav-item" data-page="profile">

                        <span>个人中心</span>
                    </a>
                    <a href="#directory" class="nav-item admin-only" data-page="directory" style="display:none">

                        <span>通知公告</span>

                        <span>系统管理</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-info" id="sidebar-user">
                        <div class="user-avatar" id="sidebar-avatar"></div>

                            <span class="user-name" id="sidebar-name"></span>
                            <span class="user-role" id="sidebar-role"></span>

            <!-- 内容区 -->
            <main class="content">
                <header class="content-header">
                    <h2 id="page-title">工作台</h2>

    <script src="js/app.js?v=3" charset="UTF-8"></script>
